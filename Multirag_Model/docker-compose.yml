# docker compose up --build                 -> frontend (8501) + backend (8000)
# docker compose --profile graph up --build -> also starts a local Neo4j container
#
# Both images are built from the project root (they share fonts/, eval/ and the
# backend's RAG core). They share one data volume, so a PDF indexed in the UI is
# also searchable through the API after `docker compose restart backend`.

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: multirag-frontend:latest
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - rag-data:/app/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: multirag-backend:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - rag-data:/app/data
    restart: unless-stopped

  # Optional local Neo4j. To use it, set in .env:
  #   NEO4J_URI=bolt://neo4j:7687
  #   NEO4J_USERNAME=neo4j
  #   NEO4J_PASSWORD=<same value as NEO4J_LOCAL_PASSWORD below>
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_LOCAL_PASSWORD:-change-me-please}
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  rag-data:
  neo4j-data:
